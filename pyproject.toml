[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-llm"
version = "0.3.0"
description = "A local journal that trains a tiny language model from scratch on your own pages."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["torch>=2.10,<2.11", "fastapi>=0.128,<0.129", "uvicorn>=0.48,<0.49", "filelock>=3.20,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<0.29", "ruff>=0.14,<1", "playwright>=1.50,<2"]

[project.scripts]
trace-llm = "trace_llm.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trace_llm = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
